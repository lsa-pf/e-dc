<style>

  * { box-sizing: border-box; }

  .flagmark { width: 24px; height: 17px; border-radius: 3px; background: repeating-conic-gradient(var(--fg) 0 25%, var(--bg) 0 50%) 0 0 / 8px 8px; border: 2px solid var(--fg); flex-shrink: 0; }
  .ro { font-size: .68rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; color: var(--best); white-space: nowrap; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .card, .status { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .status { padding: 9px 11px; gap: 4px; }

  .status b.st { font-family: var(--f-display); font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }

  .views .adot { position: absolute; top: 4px; right: 3px; width: 9px; height: 9px; border-radius: 50%; }
  /* e-Trace : bandeau d'alerte, onglet Piste, onglet Voiture 0 */

  .etcard.al .etn { background: var(--c); color: #fff; } .etcard.al span { display: grid; } .etcard.al .etbig { color: var(--c); }

  .v0two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .v0b.ghost { background: var(--surface); color: var(--muted); border: 1px solid var(--line); font-family: var(--f-body); font-size: .92rem; text-transform: none; font-weight: 700; } .v0b.ok { background: var(--best); color: #fff; }
  .v0stop { height: 48px; border-radius: 14px; border: 2px solid #d23b2f; color: #d23b2f; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; text-transform: uppercase; width: 100%; }

  .v0l.pt { grid-template-columns: 22px auto 1fr auto 26px; } .v0l input[type=text] { padding: 6px 8px; font-size: .95rem; } .v0sel { padding: 5px 4px; font-size: .85rem; width: auto; border-radius: 8px; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .86rem; color: var(--muted); }

  .tb.ep { color: var(--ep); text-decoration: line-through; }

  .lbl { font-family: var(--f-body); font-size: .74rem; font-weight: 800; color: var(--ep); }
  .lbl.soft { color: var(--muted); font-weight: 700; }
  sup { font-family: var(--f-body); font-size: .66rem; font-weight: 800; margin-left: 1px; }
  sup.p { color: var(--dt); } sup.e { color: var(--ep); }
  .rk { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; color: var(--muted); display: inline-block; min-width: 1.5em; margin-right: 2px; }
  .gap { font-family: var(--f-num); font-size: .78rem; color: var(--muted); padding-right: 6px; }
  .wait { color: var(--muted); }

  tr.onrun td { background: var(--run-bg); animation: frame 1.1s ease-in-out infinite; box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc); }
  tr.onrun td:first-child { box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc), inset 2px 0 0 var(--fc); }
  tr.onrun td:last-child { box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc), inset -2px 0 0 var(--fc); }

  .sect { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 1.08rem; margin-top: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sect small { font-family: var(--f-body); font-weight: 400; text-transform: none; font-size: .78rem; color: var(--muted); }

  .pen .h { font-family: var(--f-num); font-size: .84rem; color: var(--muted); grid-row: span 2; }
  .pen .w { font-weight: 700; font-size: .95rem; min-width: 0; }

  .pen.x { opacity: .5; } .pen.x .w { text-decoration: line-through; }

<body>
<div id="app"></div>

<script>
/* ===== e-Trace · noyau commun (e-Trace, e-DC, PC course) =====
   Tracé de référence : { name, pts: [lat, lng, lat, lng, …], marks: [{ k, name, i }] }
   k : 'dep' ligne de départ · 'arr' ligne d'arrivée · 'pt' point marqué, avec cat : 'chicane' | 'parc' | 'autre' et un nom libre
   (anciens tracés : 'pd' et 'pa' sont lus comme des parcs « Parc fermé départ » et « Parc fermé arrivée »)
   i : indice du point du tracé (dans pts / 2). Distances en mètres, comptées depuis la ligne de départ. */
const ET = (() => {
  const R = 6371008.8, rad = Math.PI / 180;
  // Réglages par défaut (modifiables plus tard par épreuve : champ « etrace » du document de l'épreuve)
  const DEF = { fast: 2, slow: 30, vStop: 1, nStop: 2, orange: 2, red: 10, lost: 6, fixLost: 15, endGuard: 50, maxAcc: 25 };
  const cfg = ev => { const o = { ...DEF }, e = ev && ev.etrace; if (e && typeof e === 'object') for (const k in DEF) if (Number.isFinite(+e[k]) && +e[k] > 0) o[k] = +e[k]; return o; };
  const dist = (a1, o1, a2, o2) => { const k = Math.cos((a1 + a2) / 2 * rad); return Math.hypot((o2 - o1) * rad * R * k, (a2 - a1) * rad * R); };

  // Prépare un tracé : coordonnées planes locales, distances cumulées, repères
  function prep(ref) {
    if (!ref || !Array.isArray(ref.pts) || ref.pts.length < 4) return null;
    const n = Math.floor(ref.pts.length / 2), lat0 = ref.pts[0], k = Math.cos(lat0 * rad);
    const P = [], cum = [0];
    for (let j = 0; j < n; j++) P.push([ref.pts[2 * j + 1] * rad * R * k, ref.pts[2 * j] * rad * R]);
    for (let j = 1; j < n; j++) cum.push(cum[j - 1] + Math.hypot(P[j][0] - P[j - 1][0], P[j][1] - P[j - 1][1]));
    const marks = (Array.isArray(ref.marks) ? ref.marks : []).filter(m => m && Number.isInteger(m.i) && m.i >= 0 && m.i < n).map(m => {
      if (m.k === 'pd' || m.k === 'pa') return { k: 'pt', cat: 'parc', name: String(m.name || '') || (m.k === 'pd' ? 'Parc fermé départ' : 'Parc fermé arrivée'), i: m.i };
      return { k: m.k, cat: m.k === 'pt' ? (['chicane', 'parc', 'autre'].includes(m.cat) ? m.cat : 'chicane') : '', name: String(m.name || ''), i: m.i };
    }).sort((a, b) => a.i - b.i);
    const dm = marks.find(m => m.k === 'dep'), am = marks.find(m => m.k === 'arr');
    const iDep = dm ? dm.i : 0, iArr = am ? am.i : n - 1, c0 = cum[iDep];
    marks.forEach(m => m.s = cum[m.i] - c0);

<script>
/* ---------------- État local ---------------- */
const LS = 'asat_dc_v1';
let S = { code: '', name: '', who: '', view: 'pass' };
try { const r = JSON.parse(localStorage.getItem(LS) || 'null'); if (r && typeof r === 'object') S = { ...S, ...r }; } catch (e) {}
if (!['pass', 'rank', 'pen', 'piste', 'v0'].includes(S.view)) S.view = 'pass';
if (!['T', 'H', 'F'].includes(S.gf)) S.gf = 'T';

const FN = { dc: 'Directeur de course', dcs: 'DC stagiaire', cs: 'Collège des commissaires sportifs' };
if (!FN[S.fn]) S.fn = 'dc';

/* ---------------- Calculs d'affichage ---------------- */
