<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>e-DC · Directeur de course</title>
<meta name="theme-color" content="#1f5fae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="e-DC">
<style>
  /* Écran du Directeur de course : lecture seule, mise à jour automatique depuis le PC course. Thème Lagon d'e-Chicane. */
  :root {
    --bg: #e9f4f5; --surface: #ffffff; --surface-2: #d8ebee; --fg: #0e2a47; --muted: #4a6274; --line: #bcd7dc;
    --flag: #1f5fae; --flag-ink: #ffffff; --best: #1e7a46; --best-bg: #d7f0e0;
    --plot: #ffd43b; --plot-ink: #2b2200; --dt: #f76707; --dt-ink: #1f0e00; --ep: #b91c1c; --ep-ink: #ffffff;
    --men: #1c56a8; --women: #c2255c; --run: #b35c00; --run-bg: #fff1dc; --run-line: #f08c00; --warn: #b35c00;
    --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0b1824; --surface: #12232f; --surface-2: #1b3140; --fg: #eaf4f6; --muted: #9fb6c2; --line: #2a4252;
    --flag: #5b9bf0; --flag-ink: #06121f; --best: #6ee7a8; --best-bg: #143b2a;
    --plot: #ffd43b; --plot-ink: #2b2200; --dt: #fd7e14; --dt-ink: #1f0e00; --ep: #e03131; --ep-ink: #ffffff;
    --men: #7fb0f7; --women: #f783ac; --run: #ffc56b; --run-bg: #3a2a10; --run-line: #ffa94d; --warn: #ffc56b; color-scheme: dark } }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body); -webkit-text-size-adjust: 100%; }
  #app { height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr; gap: 10px; align-content: start; max-width: 720px; margin: 0 auto;
         padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
  #app.form { grid-template-rows: auto auto; }
  h1, h3 { font-family: var(--f-display); margin: 0; letter-spacing: .02em; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; cursor: pointer; background: none; }
  :focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top h3 { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; display: flex; gap: 7px; align-items: center; line-height: 1.1; min-width: 0; }
  .top h3 > span:last-child { min-width: 0; }
  .top small { display: block; font-family: var(--f-body); text-transform: none; font-weight: 400; font-size: .74rem; color: var(--muted); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flagmark { width: 24px; height: 17px; border-radius: 3px; background: repeating-conic-gradient(var(--fg) 0 25%, var(--bg) 0 50%) 0 0 / 8px 8px; border: 2px solid var(--fg); flex-shrink: 0; }
  .ro { font-size: .68rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; color: var(--best); white-space: nowrap; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live.off { color: var(--warn); }

  .card, .status { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .status { padding: 9px 11px; gap: 4px; }
  .status .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .status b.st { font-family: var(--f-display); font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
  .status .onrun { display: flex; align-items: center; gap: 6px 8px; font-size: .9rem; flex-wrap: wrap; }
  .status .onrun b { font-family: var(--f-display); font-size: 1.05rem; }
  .status .sub { font-size: .8rem; color: var(--muted); }
  .pill-run { font-family: var(--f-num); font-weight: 700; color: var(--run); background: var(--run-bg); border: 1px dashed var(--run); border-radius: 6px; padding: 1px 6px; }
  .pill-fin { font-family: var(--f-num); font-weight: 700; color: var(--best); background: var(--best-bg); border-radius: 6px; padding: 1px 6px; }

  .views { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .views button { padding: 9px 4px; border-radius: 9px; font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 1rem; white-space: nowrap; }
  .views button[aria-pressed="true"] { background: var(--flag); color: var(--flag-ink); box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
  .views .cnt { font-family: var(--f-body); font-size: .72rem; background: var(--dt); color: var(--dt-ink); border-radius: 999px; padding: 1px 6px; margin-left: 4px; letter-spacing: 0; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .86rem; color: var(--muted); }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { padding: 6px 13px; border-radius: 7px; font-size: .86rem; font-weight: 800; }
  .seg button[aria-pressed="true"] { background: var(--flag); color: var(--flag-ink); }
  .pill-fin .tb.ep { color: var(--ep); }
  .scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; overscroll-behavior: contain; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
  .scroll > * { flex-shrink: 0; }

  .tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 2px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-family: var(--f-display); font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  td.pn { text-align: left; position: sticky; left: 0; background: var(--surface); padding-left: 8px; padding-right: 6px; z-index: 1; }
  th.pn { text-align: left; padding-left: 8px; left: 0; z-index: 3; }
  td.pn b { font-family: var(--f-display); font-size: 1.12rem; margin-right: 4px; }
  td.pn span { font-size: .84rem; font-weight: 700; text-transform: uppercase; }
  .m { color: var(--men); } .f { color: var(--women); }
  td.t { font-family: var(--f-num); font-size: .8rem; }
  td.t.tr { color: var(--muted); }
  .tb { display: inline-block; border-radius: 5px; padding: 1px 3px; }
  .tb.best { background: var(--best-bg); color: var(--best); font-weight: 800; }
  .tb.ep { color: var(--ep); text-decoration: line-through; }
  .tb.runn { color: var(--run); background: var(--run-bg); border: 1px dashed var(--run); font-weight: 700; animation: blink 1.1s ease-in-out infinite; }
  .lbl { font-family: var(--f-body); font-size: .74rem; font-weight: 800; color: var(--ep); }
  .lbl.soft { color: var(--muted); font-weight: 700; }
  sup { font-family: var(--f-body); font-size: .66rem; font-weight: 800; margin-left: 1px; }
  sup.p { color: var(--dt); } sup.e { color: var(--ep); }
  .rk { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; color: var(--muted); display: inline-block; min-width: 1.5em; margin-right: 2px; }
  .gap { font-family: var(--f-num); font-size: .78rem; color: var(--muted); padding-right: 6px; }
  .wait { color: var(--muted); }

  tr.onrun td { background: var(--run-bg); animation: frame 1.1s ease-in-out infinite; box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc); }
  tr.onrun td:first-child { box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc), inset 2px 0 0 var(--fc); }
  tr.onrun td:last-child { box-shadow: inset 0 2px 0 var(--fc), inset 0 -2px 0 var(--fc), inset -2px 0 0 var(--fc); }
  @property --fc { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @keyframes frame { 0%, 100% { --fc: var(--run-line); } 50% { --fc: transparent; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .sect { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 1.08rem; margin-top: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sect small { font-family: var(--f-body); font-weight: 400; text-transform: none; font-size: .78rem; color: var(--muted); }
  .pens { display: grid; gap: 6px; }
  .pen { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
  .pen .h { font-family: var(--f-num); font-size: .84rem; color: var(--muted); grid-row: span 2; }
  .pen .w { font-weight: 700; font-size: .95rem; min-width: 0; }
  .pen .w b { font-family: var(--f-display); font-size: 1.2rem; margin-right: 4px; }
  .pen .s { font-size: .8rem; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-weight: 800; font-size: .78rem; grid-row: span 2; white-space: nowrap; }
  .tag.P { background: var(--plot); color: var(--plot-ink); } .tag.D { background: var(--dt); color: var(--dt-ink); } .tag.E { background: var(--ep); color: var(--ep-ink); }
  .pen.x { opacity: .5; } .pen.x .w { text-decoration: line-through; }
  .pen.onrun, .runline { background: var(--run-bg); border-color: transparent; animation: frame 1.1s ease-in-out infinite; box-shadow: inset 0 0 0 2px var(--fc); }
  .runline { border-radius: 10px; padding: 9px 10px; font-size: .9rem; }
  .runline b { font-family: var(--f-display); font-size: 1.15rem; }
  .live-tag { color: var(--run); font-weight: 700; }
  .reps { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; overflow-x: auto; }
  .reps table td, .reps table th { border: 0; padding: 5px 3px; font-size: .82rem; position: static; }
  .ok { color: var(--best); font-weight: 700; } .inf { color: var(--dt); font-weight: 700; } .miss { color: var(--ep); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }

  label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
  input[type=text] { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 1.1rem; }
  select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 1.05rem; color: inherit; font: inherit; }
  input#code { font-family: var(--f-num); text-transform: uppercase; letter-spacing: .06em; }
  .btn { padding: 11px 14px; border-radius: 10px; background: var(--flag); color: var(--flag-ink); font-weight: 800; font-size: 1rem; }
  .btn[disabled] { opacity: .6; }
  .msg { font-size: .88rem; color: var(--warn); min-height: 1.2em; }
  .hint { font-size: .84rem; color: var(--muted); margin: 0; }
  .stt { font-weight: 800; font-size: 1.05rem; }
  .stt.wait { color: var(--warn); } .stt.ko { color: var(--ep); }
  .banner { background: var(--run-bg); color: var(--fg); border-radius: 10px; padding: 8px 10px; font-size: .85rem; }
  .foot { font-size: .76rem; color: var(--muted); text-align: center; margin: 0; display: grid; gap: 6px; justify-items: center; }
  .linkbtn { color: var(--flag); text-decoration: underline; font-size: .82rem; padding: 4px; }
  @media (prefers-reduced-motion: reduce) { tr.onrun td, .pen.onrun, .runline, .tb.runn { animation: none; --fc: var(--run-line); } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- État local ---------------- */
const LS = 'asat_dc_v1';
let S = { code: '', name: '', who: '', view: 'pass' };
try { const r = JSON.parse(localStorage.getItem(LS) || 'null'); if (r && typeof r === 'object') S = { ...S, ...r }; } catch (e) {}
if (!['pass', 'rank', 'pen'].includes(S.view)) S.view = 'pass';
if (!['T', 'H', 'F'].includes(S.gf)) S.gf = 'T';
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

const FN = { dc: 'Directeur de course', dcs: 'DC stagiaire', cs: 'Collège des commissaires sportifs' };
if (!FN[S.fn]) S.fn = 'dc';
const TYPES = { P: { sec: 2, label: 'Plot de chicane' }, D: { sec: 5, label: 'Plot de demi-tour' }, E: { sec: 0, label: 'Erreur de parcours' } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hms = v => { const d = new Date(v); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const hm = v => { const d = new Date(v); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const normCode = v => String(v || '').toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9-]/g, '');
const cls = g => g === 'F' ? 'f' : 'm';
const lastName = n => String(n || '').trim().split(/\s+/)[0] || '';
function heatLong(h) { const m = /^(E|M)(\d+)$/.exec(h || ''); return !m ? '' : m[1] === 'E' ? (m[2] === '1' ? 'Essai' : 'Essai ' + m[2]) : 'Manche ' + m[2]; }
function heatShort(h) { const m = /^(E|M)(\d+)$/.exec(h || ''); return !m ? '' : m[1] === 'E' ? (m[2] === '1' ? 'Essai' : 'Essai ' + m[2]) : 'M' + m[2]; }

/* ---------------- Liaison Firebase ---------------- */
let fbUser = null, devStatus = null, subs = [], subCode = null, boardSub = null, B = null, boardCache = false, trk = null, joinMsg = '', joinBusy = false;
window.liveReady = () => { window.FB.signInAnon().catch(() => { joinMsg = 'Connexion impossible pour le moment (réseau).'; render(); }); render(); };
window.liveAuthChanged = u => { fbUser = u || null; subscribe(); render(); };

async function join() {
  const fn = FN[document.getElementById('fn').value] ? document.getElementById('fn').value : 'dc';
  const code = normCode(document.getElementById('code').value), who = String(document.getElementById('who').value || '').replace(/[|\r\n]/g, ' ').trim();
  if (!code) { joinMsg = 'Tapez le code de l\'épreuve donné par le PC course.'; render(); return; }
  if (!window.FB || !fbUser) { joinMsg = 'Pas de connexion pour le moment : réessayez quand le téléphone a du réseau.'; render(); return; }
  const { fs, doc, getDoc, setDoc, updateDoc } = window.FB;
  joinBusy = true; joinMsg = 'Vérification du code…'; render();
  try {
    const ev = await getDoc(doc(fs, 'events', code));
    if (!ev.exists()) { joinMsg = `Code « ${code} » inconnu : vérifiez-le auprès du PC course.`; return; }
    const dref = doc(fs, 'events', code, 'devices', fbUser.uid), now = new Date().toISOString();
    const d = await getDoc(dref).catch(() => null);
    if (d && d.exists()) await updateDoc(dref, { poste: 'DC', role: 'dc', fn, who, seenAt: now });
    else await setDoc(dref, { uid: fbUser.uid, poste: 'DC', role: 'dc', fn, who, status: 'pending', at: now, seenAt: now });
    S.code = code; S.who = who; S.fn = fn; S.name = (ev.data() || {}).name || ''; persist();
    joinMsg = ''; subscribe();
  } catch (e) {
    joinMsg = e && e.code === 'unavailable' ? 'Pas de réseau : réessayez dans un instant.' : 'Impossible de rejoindre l\'épreuve (' + ((e && e.code) || 'erreur') + ').';
  } finally { joinBusy = false; render(); }
}
function leave() { if (!confirm('Quitter cette épreuve sur ce téléphone ?')) return; S.code = ''; S.name = ''; persist(); B = null; trk = null; subscribe(); render(); }

function subscribe() {
  const code = window.FB && fbUser && S.code ? S.code : null;
  if (code === subCode) return;
  subs.forEach(u => { try { u(); } catch (e) {} }); subs = [];
  if (boardSub) { try { boardSub(); } catch (e) {} boardSub = null; }
  subCode = code; devStatus = null; B = null; trk = null;
  if (!code) return;
  let autoAsk = false;
  const { fs, doc, onSnapshot } = window.FB;
  subs.push(onSnapshot(doc(fs, 'events', code, 'devices', fbUser.uid), snap => {
    devStatus = snap.exists() ? snap.data().status : 'gone';
    // déclaration absente (nouvelle identité du téléphone après mise à jour) : nouvelle demande, à accepter par le PC course
    if (!snap.exists() && !snap.metadata.fromCache && !autoAsk) { autoAsk = true; const now = new Date().toISOString(); window.FB.setDoc(window.FB.doc(window.FB.fs, 'events', code, 'devices', fbUser.uid), { uid: fbUser.uid, poste: 'DC', role: 'dc', fn: S.fn, who: S.who, status: 'pending', at: now, seenAt: now }).catch(() => {}); }
    if (devStatus === 'ok') subBoard(); else if (boardSub && devStatus !== 'ok' && !snap.metadata.fromCache) { boardSub(); boardSub = null; B = null; }
    render();
  }, () => {}));
  subs.push(onSnapshot(doc(fs, 'events', code), snap => { if (snap.exists()) { const n = (snap.data() || {}).name || ''; if (n && n !== S.name) { S.name = n; persist(); render(); } } }, () => {}));
  subs.push(onSnapshot(doc(fs, 'events', code, 'public', 'track'), snap => { trk = snap.exists() ? (snap.data() || {}) : null; if (trk) trk.gotAt = Date.now(); render(); }, () => {}));
}
function subBoard() {
  if (boardSub || !subCode) return;
  const { fs, doc, onSnapshot } = window.FB;
  boardSub = onSnapshot(doc(fs, 'events', subCode, 'dc', 'board'), { includeMetadataChanges: true }, snap => {
    boardCache = snap.metadata.fromCache;
    B = snap.exists() ? (snap.data() || null) : null;
    render();
  }, () => { boardSub = null; render(); });
}
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());

/* ---------------- Calculs d'affichage ---------------- */
function rows() { return B && Array.isArray(B.rows) ? B.rows : []; }
function ranking(gf) {
  const list = rows().filter(r => !gf || gf === 'T' || (r.g === 'F' ? 'F' : 'H') === gf).sort((a, b) => { const fa = a.best != null, fb = b.best != null; return fa !== fb ? (fa ? -1 : 1) : (fa && a.best !== b.best ? a.best - b.best : (+a.o || 0) - (+b.o || 0)); });
  const rk = new Map(); let pos = 0, prev = null;
  list.forEach((r, i) => { if (r.best == null) return; if (r.best !== prev) pos = i + 1; prev = r.best; rk.set(r.n, pos); });
  return { list, rk, lead: list.length && list[0].best != null ? list[0].best : null };
}
function trackRun() { return trk && trk.status === 'run' && trk.bib ? String(trk.bib) : null; }
function runSet() {
  const s = new Set(rows().filter(r => (r.c || []).some(c => c && c.k === 'run')).map(r => r.n));
  const t = trackRun(); if (t) s.add(t);
  return s;
}
// manche courue par le pilote en piste : celle de sa case « … », sinon la manche en cours annoncée par le PC course
function runHeat(n) { const r = rows().find(x => x.n === n), i = r ? (r.c || []).findIndex(c => c && c.k === 'run') : -1; return i >= 0 && Array.isArray(B.hcodes) && B.hcodes[i] ? B.hcodes[i] : (B.heat || ''); }
function activeInfr() { return (B && Array.isArray(B.infr) ? B.infr : []).filter(i => !i.x); }
function fmtGap(v) { const d = Math.min(3, Math.max(1, Number(B && B.dec) || 3)); return '+' + v.toFixed(d); }

function cellHTML(c, i) {
  const ppSup = c && c.pp ? (c.pp < 0 ? '<sup class="e">EP</sup>' : `<sup class="p">+${c.pp}</sup>`) : '';
  if (!c || !c.k) return '<span class="wait">—</span>';
  switch (c.k) {
    case 't': return `<span class="tb ${c.b ? 'best' : ''}">${esc(c.v)}</span>${c.p ? `<sup class="p">+${c.p}</sup>` : ''}`;
    case 'ep': return `<span class="tb ep">${esc(c.v)}</span><sup class="e">EP</sup>`;
    case 'run': return `<span class="tb runn">…</span>${ppSup}`;
    case 'pend': return (c.l ? `<span class="lbl">${esc(c.l)}</span>` : '<span class="wait">—</span>') + ppSup;
    case 'dns': case 'dnf': case 'dsq': return `<span class="lbl">${c.k.toUpperCase()}</span>`;
    case 'cxl': return '<span class="lbl">Annulée</span>';
    case 'nc': return '<span class="lbl soft">non courue</span>';
    default: return `<span class="lbl">${esc(String(c.k).toUpperCase())}</span>`;
  }
}

/* ---------------- Affichage ---------------- */
function headTop() {
  return `<div class="top"><h3><span class="flagmark" aria-hidden="true"></span><span><span style="text-transform:none">e-DC</span><small>${esc(S.name || (B && B.name) || (S.code ? 'Épreuve ' + S.code : 'Directeur de course'))}</small></span></h3><span class="ro">🔒 Lecture seule</span></div>`;
}
function statusHTML() {
  const off = !navigator.onLine || boardCache;
  const upd = B && B.at ? `<span class="live ${off ? 'off' : ''}">${off ? 'hors ligne · ' : 'à jour '}${hms(B.at)}</span>` : '';
  let on = 'Piste libre';
  const run = trackRun();
  if (run) on = `En piste : <span class="pill-run">n° ${esc(run)}</span> <b class="${cls(trk.g)}">${esc(lastName(trk.name))}</b> · parti à ${hms(Number(trk.startAt))} · <span id="elap">${elapsed()}</span>`;
  else if (trk && trk.status === 'fin' && trk.bib && Date.now() - trk.gotAt < 12000) on = `Arrivé : n° ${esc(trk.bib)} <b class="${cls(trk.g)}">${esc(lastName(trk.name))}</b> ${finTime()}`;
  let sub = '';
  if (B) {
    const h = B.heat || '', postes = Array.isArray(B.postes) ? B.postes : [], reps = B.reps || {};
    const rl = h && postes.length ? `Relevés ${esc(heatShort(h))} : ` + postes.map(p => `P${esc(p)} ${reps[h + '|' + p] !== undefined ? '✓' : 'en attente'}`).join(' · ') + ' — ' : '';
    const n = activeInfr().length;
    sub = `<div class="sub">${rl}${n} infraction${n > 1 ? 's' : ''} dans l'épreuve</div>`;
  }
  return `<div class="status"><div class="r1"><b class="st">${esc(B ? B.stage : 'En attente')}</b>${upd}</div><div class="onrun">${on}</div>${sub}</div>`;
}
// temps d'arrivée : temps retenu par le PC course (pénalités comprises) dès qu'il est dans le tableau, sinon temps brut
function finTime() {
  const r = rows().find(x => x.n === String(trk.bib)), c = r && Number.isInteger(trk.slot) ? (r.c || [])[trk.slot] : null;
  if (c && c.k === 't') return `<span class="pill-fin">${esc(c.v)}${c.p ? `<sup class="p">+${c.p}</sup>` : ''}</span>`;
  if (c && c.k === 'ep') return `<span class="pill-fin"><span class="tb ep" style="padding:0">${esc(c.v)}</span><sup class="e">EP</sup></span>`;
  return `<span class="pill-fin">${esc(trk.time || '')}</span>${c && c.pp ? (c.pp < 0 ? '<sup class="e">EP</sup>' : `<sup class="p">+${c.pp}</sup>`) : ''}`;
}
function elapsed() { const s = Math.max(0, Math.floor((Date.now() - Number(trk && trk.startAt || Date.now())) / 1000)); return s + ' s'; }
function viewsHTML() {
  const b = (k, l, extra = '') => `<button aria-pressed="${S.view === k}" onclick="setView('${k}')">${l}${extra}</button>`;
  const n = activeInfr().length;
  return `<div class="views" role="group" aria-label="Vue">${b('pass', 'Passage')}${b('rank', 'Classement')}${b('pen', 'Pénalités', n ? `<span class="cnt">${n}</span>` : '')}</div>`;
}
function tableHTML(mode) {
  const heads = Array.isArray(B.heads) ? B.heads : [], nE = Number(B.nE) || 0, run = runSet();
  const R = ranking(mode === 'rank' ? S.gf : 'T'), list = mode === 'rank' ? R.list : rows();
  const gb = (k, l) => `<button aria-pressed="${S.gf === k}" onclick="setGf('${k}')">${l}</button>`;
  const filt = mode === 'rank' ? `<div class="bar"><span class="label">${S.gf === 'H' ? 'Classement hommes' : S.gf === 'F' ? 'Classement femmes' : 'Classement scratch'}</span><span class="seg" role="group" aria-label="Pilotes">${gb('T', 'Tous')}${gb('H', 'H')}${gb('F', 'F')}</span></div>` : '';
  if (!list.length) return filt + `<div class="empty">${mode === 'rank' && S.gf !== 'T' ? 'Aucun' + (S.gf === 'F' ? 'e pilote femme' : ' pilote homme') + ' dans l\'épreuve.' : 'Aucun pilote dans l\'épreuve pour le moment.'}</div>`;
  return filt + `<div class="tw"><table><thead><tr><th class="pn">${mode === 'rank' ? 'Rg · ' : ''}Pilote</th>${heads.map(h => `<th>${esc(h)}</th>`).join('')}${mode === 'rank' ? '<th>Écart</th>' : ''}</tr></thead><tbody>`
    + list.map(r => `<tr class="${run.has(r.n) ? 'onrun' : ''}"><td class="pn">${mode === 'rank' ? `<span class="rk">${R.rk.get(r.n) || 'NC'}</span>` : ''}<b class="${cls(r.g)}">${esc(r.n)}</b><span class="${cls(r.g)}">${esc(lastName(r.name))}</span></td>`
      + heads.map((h, i) => `<td class="t ${i < nE ? 'tr' : ''}">${cellHTML((r.c || [])[i], i)}</td>`).join('')
      + (mode === 'rank' ? `<td class="gap">${r.best == null ? '' : r.best === R.lead ? '—' : fmtGap(r.best - R.lead)}</td>` : '') + '</tr>').join('')
    + '</tbody></table></div>';
}
function pensHTML() {
  const run = runSet(), byN = new Map(rows().map(r => [r.n, r])), h = B.heat || '';
  const all = (Array.isArray(B.infr) ? B.infr : []).slice().reverse();
  let head = '';
  const rb = trackRun() || [...run][0];
  if (rb) {
    const r = byN.get(rb) || { n: rb, name: trk && trk.name || '', g: trk && trk.g };
    const rh = runHeat(rb), has = all.some(i => !i.x && i.n === rb && i.h === rh);
    head = `<div class="runline">En piste : <b class="${cls(r.g)}">${esc(r.n)} ${esc(r.name)}</b>${rh ? ' · ' + esc(heatLong(rh)) : ''} · ${has ? 'infraction signalée ci-dessous' : 'aucune infraction pour l\'instant'}</div>`;
  }
  const list = all.length ? `<div class="pens">${all.map(i => {
    const r = byN.get(i.n), live = !i.x && run.has(i.n) && i.h === runHeat(i.n), t = TYPES[i.t] || TYPES.P;
    const cancel = i.x === 'poste' ? ' · annulée par le poste' : i.x ? ' · annulée par le chrono' : '';
    return `<div class="pen ${i.x ? 'x' : ''} ${live ? 'onrun' : ''}"><span class="h">${esc(hm(i.at))}</span><span class="w"><b class="${cls(r && r.g)}">${esc(i.n)}</b><span class="${cls(r && r.g)}">${esc(r ? r.name : 'n° inconnu')}</span></span><span class="tag ${esc(i.t)}">${i.t === 'E' ? 'EP' : '+' + t.sec + ' s'}</span><span class="s">${esc(heatLong(i.h) || i.h)} · ${/^P\d/.test(i.p) ? 'poste ' + esc(i.p.slice(1)) : esc(i.p)} · ${esc(t.label)}${t.sec ? ' +' + t.sec + ' s' : ''}${cancel}${live ? ' · <span class="live-tag">pilote en piste</span>' : ''}</span></div>`;
  }).join('')}</div>` : '<div class="empty">Aucune infraction pour le moment.</div>';
  return head + `<div class="sect">Infractions <small>la plus récente en haut</small></div>` + list + repsHTML();
}
function repsHTML() {
  const postes = Array.isArray(B.postes) ? B.postes : [], heads = Array.isArray(B.heads) ? B.heads : [], codes = Array.isArray(B.hcodes) ? B.hcodes : [], reps = B.reps || {}, closed = Number(B.closed);
  if (!postes.length) return '';
  return `<div class="sect">Relevés de fin de manche</div><div class="reps"><table><thead><tr><th style="text-align:left">Poste</th>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`
    + postes.map(p => `<tr><td style="text-align:left"><b>Poste ${esc(p)}</b></td>${codes.map((c, i) => { const v = reps[c + '|' + p];
      return v !== undefined ? `<td class="${v ? 'inf' : 'ok'}">${v ? v + ' inf.' : 'RAS'}</td>` : `<td class="${i <= closed ? 'miss' : 'wait'}">${i <= closed ? 'manquant' : '—'}</td>`; }).join('')}</tr>`).join('')
    + '</tbody></table></div>';
}
function footHTML() {
  return `<div class="foot"><span>Mise à jour automatique depuis le PC course · ${esc(S.code)} · ${esc(FN[S.fn])}${S.who ? ' · ' + esc(S.who) : ''}</span><button class="linkbtn" onclick="leave()">Quitter l'épreuve</button></div>`;
}

function render() {
  const app = document.getElementById('app'), sc = app.querySelector('.scroll'), y = sc ? sc.scrollTop : 0, x = sc && sc.querySelector('.tw') ? sc.querySelector('.tw').scrollLeft : 0;
  const vals = {}; for (const id of ['code', 'who', 'fn']) { const el = document.getElementById(id); vals[id] = el ? el.value : null; }
  const ae = document.activeElement, keep = ae && (ae.id === 'code' || ae.id === 'who' || ae.id === 'fn') ? { id: ae.id, v: ae.value, s: ae.selectionStart } : null;
  {
    if (!S.code) {
      app.className = 'form';
      app.innerHTML = headTop() + `<div class="card">
        <h3 style="font-size:1.2rem;text-transform:uppercase">Rejoindre l'épreuve</h3>
        <p class="hint">Écran du Directeur de course : temps, classement et pénalités en direct, sans aucune modification possible. Le PC course doit accepter ce téléphone.</p>
        <label>Code de l'épreuve<input type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ex. TIAREI-3813"></label>
        <label>Votre fonction<select id="fn">${Object.entries(FN).map(([k, v]) => `<option value="${k}" ${S.fn === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label>Votre nom<input type="text" id="who" autocomplete="name" value="${esc(S.who)}" placeholder="ex. Teva Mauri"></label>
        <button class="btn" onclick="join()" ${joinBusy ? 'disabled' : ''}>Rejoindre</button>
        <div class="msg">${esc(joinMsg)}</div></div>`;
      for (const id in vals) { const el = document.getElementById(id); if (el && vals[id] !== null) el.value = vals[id]; }
      if (keep) { const el = document.getElementById(keep.id); el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) {} }
      return;
    }
  }
  if (devStatus !== 'ok' && !B) {
    app.className = 'form';
    const t = !window.FB || !fbUser ? ['Connexion…', 'wait'] : devStatus === 'refused' ? ['✕ Refusé par le PC course', 'ko'] : devStatus === 'gone' ? ['Téléphone retiré de l\'épreuve', 'ko'] : devStatus === 'pending' ? ['⏳ En attente de validation par le PC course', 'wait'] : ['Connexion…', 'wait'];
    app.innerHTML = headTop() + `<div class="card"><div class="stt ${t[1]}">${t[0]}</div>
      <p class="hint">Épreuve <b>${esc(S.code)}</b>${S.name ? ' · ' + esc(S.name) : ''}. ${devStatus === 'pending' ? 'Dans PC course, rubrique « Liaison en direct », touchez « Accepter » sur la ligne « Directeur de course ».' : devStatus === 'refused' || devStatus === 'gone' ? 'Demandez au PC course de vous accepter, puis rejoignez à nouveau l\'épreuve.' : ''}</p>
      ${devStatus === 'refused' || devStatus === 'gone' ? `<button class="btn" onclick="rejoin()">Rejoindre à nouveau</button>` : ''}
      <button class="linkbtn" onclick="leave()">Changer d'épreuve</button></div>`;
    return;
  }
  app.className = '';
  const warn = devStatus && devStatus !== 'ok' && devStatus !== null ? `<div class="banner">${devStatus === 'pending' ? 'En attente de validation par le PC course : données affichées de la dernière connexion.' : 'Ce téléphone n\'est plus accepté par le PC course : données figées.'}</div>` : '';
  const body = !B ? '<div class="empty">En attente des données du PC course…<br>Le tableau apparaîtra dès que PC course aura publié l\'épreuve.</div>'
    : S.view === 'pen' ? pensHTML() : tableHTML(S.view);
  app.innerHTML = headTop() + statusHTML() + viewsHTML() + `<div class="scroll">${warn}${body}${footHTML()}</div>`;
  const sc2 = app.querySelector('.scroll'); if (sc2) { sc2.scrollTop = y; const tw = sc2.querySelector('.tw'); if (tw) tw.scrollLeft = x; }
}
async function rejoin() {
  if (!window.FB || !fbUser || !S.code) return;
  const { fs, doc, setDoc, deleteDoc } = window.FB, now = new Date().toISOString();
  // le statut ne peut pas être changé par le téléphone : on redemande en créant une nouvelle déclaration si elle a été supprimée
  if (devStatus === 'gone') await setDoc(doc(fs, 'events', S.code, 'devices', fbUser.uid), { uid: fbUser.uid, poste: 'DC', role: 'dc', fn: S.fn, who: S.who, status: 'pending', at: now, seenAt: now }).catch(() => {});
  else alert('Le PC course doit retirer le refus : dans PC course, touchez « Accepter » sur la ligne « Directeur de course ».');
}
function setGf(v) { S.gf = v; persist(); render(); }
function setView(v) { S.view = v; persist(); render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; }
setInterval(() => {
  const e = document.getElementById('elap'); if (e && trackRun()) e.textContent = elapsed();
  if (trk && trk.status === 'fin' && trk.gotAt && Date.now() - trk.gotAt > 12000 && Date.now() - trk.gotAt < 14000) render();
}, 1000);
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
